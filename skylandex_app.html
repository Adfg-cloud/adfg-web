<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skylandex</title>
<style>
:root{
  --bg:#0f1220;--card:#1b1f36;--card2:#232847;--text:#f1f3ff;--muted:#9aa0c3;
  --accent:#6c5ce7;--border:#2e3358;--good:#2ecc71;
  --Air:#8ecae6;--Earth:#a0785a;--Fire:#ff6b4a;--Water:#4aa9ff;--Magic:#c77dff;
  --Tech:#ffd166;--Life:#7bd389;--Undead:#8d7fc7;--Dark:#5b5b5b;--Light:#ffe89b;--Kaos:#c0392b;--None:#888;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){--bg:#f4f5fb;--card:#ffffff;--card2:#eef0fb;--text:#1a1c2e;--muted:#5b5f7a;--border:#dfe2f5;}
}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  background-image: radial-gradient(ellipse 900px 500px at 50% -80px, rgba(108,92,231,.35), transparent 70%), url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><circle cx='70' cy='70' r='45' fill='none' stroke='rgba(255,255,255,0.05)' stroke-width='2'/><circle cx='70' cy='70' r='62' fill='none' stroke='rgba(255,255,255,0.03)' stroke-width='1'/></svg>");
  background-repeat:no-repeat,repeat; background-attachment:fixed,fixed;
}
header{position:sticky;top:0;background:var(--bg);padding:16px 16px 8px;padding-top:calc(16px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--border);z-index:5}
h1{margin:0 0 10px;font-size:20px}
.stats{font-size:13px;color:var(--muted);margin-bottom:10px}
.stats b{color:var(--good)}
input[type=text]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:14px;margin-bottom:8px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.filters button{flex:none;padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:12px;cursor:pointer}
.filters button.active{background:var(--accent);border-color:var(--accent);color:#fff}
main{padding:12px 16px 40px;max-width:900px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.fig{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center}
.fig.owned{border-color:var(--good)}
.badge{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;color:#111;font-size:14px;cursor:pointer;overflow:hidden}
.badge img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:0}
.name{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.name:hover{text-decoration:underline}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;max-width:400px;width:100%;max-height:85vh;overflow-y:auto;position:relative}
.modal-close{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:var(--card2);color:var(--text);cursor:pointer}
.modal-img{width:100%;aspect-ratio:1;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:700;color:#111;margin-bottom:12px;cursor:pointer}
.modal-img img{width:100%;height:100%;object-fit:cover}
#modalName{margin:0 0 4px;font-size:20px}
.modal-bio{font-size:13px;line-height:1.5;color:var(--text);margin:12px 0}
.variant-link{display:inline-block;margin:4px 6px 0 0;padding:5px 10px;border-radius:16px;background:var(--card2);border:1px solid var(--border);font-size:12px;cursor:pointer;color:var(--text)}
.stat-row{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:11px}
.stat-label{width:78px;flex:none;color:var(--muted)}
.stat-bar-bg{flex:1;height:8px;border-radius:4px;background:var(--card2);overflow:hidden}
.stat-bar-fill{height:100%;background:var(--accent);border-radius:4px}
.stat-val{width:28px;text-align:right;flex:none}
.meta{font-size:11px;color:var(--muted)}
.ctrl{display:flex;align-items:center;gap:6px;margin-top:4px}
.ctrl button{width:24px;height:24px;border-radius:6px;border:1px solid var(--border);background:var(--card2);color:var(--text);cursor:pointer}
.ctrl span{min-width:16px;text-align:center;font-size:13px}
.icon-btn{width:24px;height:24px;border-radius:6px;border:1px solid var(--border);background:var(--card2);cursor:pointer;font-size:13px;line-height:1;opacity:.4}
.icon-btn.on{opacity:1;background:var(--accent);border-color:var(--accent)}
.owned-check{width:18px;height:18px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px;opacity:.8}
</style>
</head>
<body>
<header>
  <h1>🎮 Skylandex</h1>
  <div class="filters" id="catTabs"></div>
  <div class="filters" id="specialFilters"></div>
  <div class="stats" id="stats"></div>
  <input type="text" id="search" placeholder="Buscar por nombre...">
  <div class="filters" id="gameFilters"></div>
  <div class="filters" id="elemFilters"></div>
  <div class="filters" id="roleFilters"></div>
  <div class="filters" id="quickFilters"></div>
</header>
<main><div class="grid" id="grid"></div></main>
<div id="modalOverlay" class="modal-overlay" style="display:none">
  <div class="modal">
    <button id="modalClose" class="modal-close">✕</button>
    <div id="modalImg" class="modal-img"></div>
    <h2 id="modalName"></h2>
    <div id="modalMeta" class="meta"></div>
    <p id="modalBio" class="modal-bio"></p>
    <div id="modalStats"></div>
    <div id="modalVariants"></div>
  </div>
</div>
<footer>Skylandex · Personajes, Minis, Vehículos, Trampas, Objetos Mágicos, Cristales de Creación y Packs de Aventura de Skylanders.</footer>

const START_HP = {"Crusher":470,"Crusher (Granite)":470,"Flashwing":260,"Flashwing (Jade)":260,"Bouncer":430,"Bouncer (Legendary)":430,"Sprocket":240,"Eye-Brawl":430,"Fright Rider":270,"Tree Rex":430,"Tree Rex (Gnarly)":430,"Shroomboom":260,"Stealth Elf (Legendary)":270,"Hot Head":430,"Hot Dog":250,"Hot Dog (Molten)":250,"Ignitor (Legendary)":240,"Ninjini":410,"Ninjini (Scarlet)":410,"Pop Fizz":270,"Pop Fizz (Punch)":270,"Double Trouble (Royal)":250,"Swarm":400,"Jet-Vac":240,"Jet-Vac (Legendary)":240,"Whirlwind (Polar)":270,"Thumpback":460,"Chill":260,"Chill (Legendary)":260,"Slam Bam (Legendary)":310};
// (En Spyro's Adventure la vida inicial es exactamente la mitad de la máxima.)
const BAD = new Set();
function slug(t){ return t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/['’.]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); }
function imgCandidates(name){
  const base = baseName(name), l = [];
  if(IMAGES[name]) l.push(IMAGES[name]);
  if(IMAGE_FOLDER) l.push(IMAGE_FOLDER+slug(name)+IMAGE_EXT);
  if(base!==name){ if(IMAGES[base]) l.push(IMAGES[base]); if(IMAGE_FOLDER) l.push(IMAGE_FOLDER+slug(base)+IMAGE_EXT); }
  return l.filter(u=>!BAD.has(u));
}
function imgHtml(name, letter){
  const c = imgCandidates(name); if(!c.length) return letter;
  return `<img src="${c[0]}" alt="" data-i="0" data-l="${letter}" data-c="${c.map(encodeURIComponent).join(',')}" onerror="imgNext(this)">`;
}
function imgNext(el){
  const l = el.dataset.c.split(',').map(decodeURIComponent); let i = +el.dataset.i; BAD.add(l[i]); i++;
  if(i<l.length){ el.dataset.i=i; el.src=l[i]; } else el.replaceWith(document.createTextNode(el.dataset.l));
}
function noteHtml(t){ return `<p style="font-size:11px;color:var(--muted);margin:6px 0 0">${t}</p>`; }
function statsHtml(n, game, base){
  let html='', inherited=false;
  if(game==='Imaginators'){
    let v=STATS_IMG[n]; if(!v && STATS_IMG[base]){ v=STATS_IMG[base]; inherited=true; }
    if(v) html = statBar('Vida (nivel 1)',v.hp,450)+statBar('Ataque',v.atk,20)+statBar('Armadura',v.arm,20)+statBar('Velocidad',v.spd,25)+statBar('Suerte',v.luck,20);
  } else if(game==='SuperChargers'){
    const v=STATS_SC[n];
    if(v) html = statBar('Poder',v[0],300)+statBar('Armadura',v[1],300)+statBar('Agilidad',v[2],300)+statBar('Suerte',v[3],300);
  } else if(game==='Trap Team'){
    let v=STATS_TT[n]; if(!v && /\(Clear\)$/.test(n) && STATS_TT[base]){ v=STATS_TT[base]; inherited=true; }
    if(v) html = statBar('Vida inicial',v[4],1500)+statBar('Vida máx.',v[3],1500)+statBar('Velocidad',v[0],90)+statBar('Armadura',v[1],90)+statBar('Crítico',v[2],150);
  } else if(game==="Spyro's Adventure" || game==='Giants'){
    let v=STATS[n], k=n; if(!v && STATS[base]){ v=STATS[base]; k=base; inherited=true; }
    if(v){ const hs = START_HP[k] ?? Math.round(v.hp/2);
      html = statBar('Vida inicial',hs,1250)+statBar('Vida máx.',v.hp,1250)+statBar('Velocidad',v.spd,60)+statBar('Armadura',v.arm,55)+statBar('Crítico',v.crit,90)+statBar('Poder elem.',v.elem,25); }
  }
  if(!html) return noteHtml('Estadísticas no disponibles para esta figura: no hay ninguna fuente fiable que las documente.');
  if(inherited) html += noteHtml('Esta variante no tiene datos propios documentados: se muestran los del personaje base.');
  html += noteHtml('Valores base (sin mejoras, sombreros ni nivel extra). Fuente: darkSpyro.net. Cada juego usa una escala distinta: no compares números entre juegos.');
  return html;
}
function openDetail(key){
  const [cat, name] = key.split(':');
  const catData = CATS[cat].data;
  const entry = catData.find(d=>d[0]===name);
  if(!entry) return;
  const [n, game, elem] = entry;
  const s = state[key] || {};
  const bgKey = (elem==='—' ? 'None' : elem.replace(/[^A-Za-z]/g,'')) || 'None';
  const base = baseName(n);
  document.getElementById('modalImg').innerHTML = imgHtml(n, n[0]);
  document.getElementById('modalImg').style.background = `var(--${bgKey})`;
  document.getElementById('modalImg').style.cursor = 'default';
  document.getElementById('modalImg').onclick = null;
  document.getElementById('modalName').textContent = n;
  document.getElementById('modalMeta').textContent = game + (elem!=='—' ? ' · '+elem : '');
  const bioText = BIOS[n] || (BIOS[base] ? BIOS[base] + ' (Esta es una variante de ' + base + '.)' : 'Todavía no hay descripción para esta ficha.');
  document.getElementById('modalBio').textContent = bioText;
  document.getElementById('modalStats').innerHTML = (cat==='personajes'||cat==='minis') ? statsHtml(n, game, base) : '';
  const variants = catData.filter(d=>baseName(d[0])===base);
  const vhtml = variants.length>1
    ? '<div style="margin-top:8px"><b style="font-size:12px;color:var(--muted)">Variantes:</b><br>' + variants.map(v=>`<span class="variant-link" data-k="${cat}:${v[0]}">${v[0]===n?'▸ ':''}${v[0]}</span>`).join('') + '</div>'
    : '';
  document.getElementById('modalVariants').innerHTML = vhtml;
  document.querySelectorAll('.variant-link').forEach(el=>el.onclick=()=>openDetail(el.dataset.k));
  document.getElementById('modalOverlay').style.display='flex';
}
document.getElementById('modalClose').onclick = ()=> document.getElementById('modalOverlay').style.display='none';
document.getElementById('modalOverlay').onclick = (e)=>{ if(e.target.id==='modalOverlay') e.currentTarget.style.display='none'; };

let state = {};
const KEY='skylanders_collection_v2';
try{ state = JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){ state = {}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

const ROLE_NAMES = {
  'Gigante': ['Bouncer','Crusher','Eye-Brawl','Hot Head','Ninjini','Swarm','Thumpback','Tree Rex'],
  'Swapper': ['Blast Zone','Boom Jet','Doom Stone','Free Ranger','Freeze Blade','Fire Kraken','Grilla Drilla','Hoot Loop','Magna Charge','Night Shift','Rattle Shake','Rubble Rouser','Spy Rise','Stink Bomb','Trap Shadow','Wash Buckler'],
  'Trap Master': ['Blastermind','Bushwhack','Enigma','Gearshift','Gusto','Head Rush','Jawbreaker','Ka-Boom','Knight Light','Knight Mare','Krypt King','Lob-Star','Short Cut','Snap Shot','Thunderbolt','Tuff Luck','Wallop','Wildfire']
};
function baseName(name){ return name.split(' (')[0]; }
let activeRole='Todos';
function renderRoleFilters(){
  const rf=document.getElementById('roleFilters');
  if(activeCat!=='personajes'){ rf.innerHTML=''; return; }
  const roles=['Todos', ...Object.keys(ROLE_NAMES)];
  rf.innerHTML = roles.map(r=>`<button data-r="${r}" class="${r===activeRole?'active':''}">${r}</button>`).join('');
  rf.querySelectorAll('button').forEach(b=>b.onclick=()=>{activeRole=b.dataset.r; renderRoleFilters(); renderGrid();});
}
let activeGame='Todos', activeElem='Todos', query='';
let games=[], elems=[];
let onlyFav=false, onlyWant=false;

function renderQuickFilters(){
  const qf=document.getElementById('quickFilters');
  qf.innerHTML = `<button id="favBtn" class="${onlyFav?'active':''}">★ Favoritas</button><button id="wantBtn" class="${onlyWant?'active':''}">🔖 Quiero conseguir</button>`;
  document.getElementById('favBtn').onclick=()=>{onlyFav=!onlyFav; renderQuickFilters(); renderGrid();};
  document.getElementById('wantBtn').onclick=()=>{onlyWant=!onlyWant; renderQuickFilters(); renderGrid();};
}

function renderCatTabs(){
  const ct=document.getElementById('catTabs');
  ct.innerHTML = Object.keys(CATS).map(k=>`<button data-c="${k}" class="${k===activeCat?'active':''}">${CATS[k].label}</button>`).join('');
  ct.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    activeCat=b.dataset.c; activeGame='Todos'; activeElem='Todos'; activeRole='Todos'; query='';
    document.getElementById('search').value='';
    recalcFilterOptions(); renderCatTabs(); renderFilters(); renderRoleFilters(); renderStats(); renderGrid();
  });
}
function recalcFilterOptions(){
  const data = CATS[activeCat].data;
  games=['Todos', ...new Set(data.map(d=>d[1]))];
  elems=['Todos', ...new Set(data.map(d=>d[2]).filter(e=>e!=='—'))];
}

function renderFilters(){
  const gf=document.getElementById('gameFilters');
  gf.innerHTML = games.map(g=>`<button data-g="${g}" class="${g===activeGame?'active':''}">${g}</button>`).join('');
  gf.querySelectorAll('button').forEach(b=>b.onclick=()=>{activeGame=b.dataset.g; renderFilters(); renderGrid();});
  const ef=document.getElementById('elemFilters');
  ef.innerHTML = elems.length ? elems.map(e=>`<button data-e="${e}" class="${e===activeElem?'active':''}">${e}</button>`).join('') : '';
  ef.querySelectorAll('button').forEach(b=>b.onclick=()=>{activeElem=b.dataset.e; renderFilters(); renderGrid();});
}

function renderStats(){
  const data = CATS[activeCat].data;
  const total = data.length;
  const owned = data.filter(([name])=>state[activeCat+':'+name]?.owned).length;
  document.getElementById('stats').innerHTML = `Tienes <b>${owned}</b> de <b>${total}</b> en ${CATS[activeCat].label.toLowerCase()}`;
}

function renderGrid(){
  const grid=document.getElementById('grid');
  const q=query.trim().toLowerCase();
  const data = CATS[activeCat].data;
  const items = data.filter(([name,game,elem])=>{
    if(activeGame!=='Todos' && game!==activeGame) return false;
    if(activeElem!=='Todos' && elem!==activeElem) return false;
    if(activeCat==='personajes' && activeRole!=='Todos' && !ROLE_NAMES[activeRole].includes(baseName(name))) return false;
    if(q && !name.toLowerCase().includes(q)) return false;
    const s = state[activeCat+':'+name];
    if(onlyFav && !(s && s.fav)) return false;
    if(onlyWant && !(s && s.want)) return false;
    return true;
  });
  grid.innerHTML = items.map(([name,game,elem])=>{
    const key = activeCat+':'+name;
    const s = state[key] || {owned:false, qty:0, fav:false, want:false};
    const bgKey = (elem==='—' ? 'None' : elem.replace(/[^A-Za-z]/g,'')) || 'None';
    const badgeInner = imgHtml(name, name[0]);
    const badge = `<div class="badge" data-n="${key}" style="background:var(--${bgKey})">${badgeInner}</div>`;
    return `<div class="fig ${s.owned?'owned':''}">
      ${badge}
      <div class="info">
        <div class="name" data-n="${key}">${name}</div>
        <div class="meta">${game}${elem!=='—'?' · '+elem:''}</div>
        <div class="ctrl">
          <input type="checkbox" class="owned-check" data-n="${key}" ${s.owned?'checked':''}>
          <button data-n="${key}" data-d="-1">−</button><span>${s.qty}</span><button data-n="${key}" data-d="1">+</button>
          <button class="icon-btn fav-btn ${s.fav?'on':''}" data-n="${key}">★</button>
          <button class="icon-btn want-btn ${s.want?'on':''}" data-n="${key}">🔖</button>
        </div>
      </div>
    </div>`;
  }).join('') || '<p style="color:var(--muted)">Nada con esos filtros.</p>';

  grid.querySelectorAll('.owned-check').forEach(c=>c.onchange=()=>{
    const n=c.dataset.n; state[n]=state[n]||{owned:false,qty:0};
    state[n].owned=c.checked;
    if(c.checked && state[n].qty===0) state[n].qty=1;
    if(!c.checked) state[n].qty=0;
    save(); renderStats(); renderGrid();
  });
  grid.querySelectorAll('.ctrl > button:not(.icon-btn)').forEach(b=>b.onclick=()=>{
    const n=b.dataset.n; state[n]=state[n]||{owned:false,qty:0,fav:false,want:false};
    state[n].qty=Math.max(0, state[n].qty + parseInt(b.dataset.d));
    state[n].owned = state[n].qty>0;
    save(); renderStats(); renderGrid();
  });
  grid.querySelectorAll('.name').forEach(el=>el.onclick=()=>openDetail(el.dataset.n));
  grid.querySelectorAll('.badge').forEach(b=>b.onclick=()=>openDetail(b.dataset.n));
  grid.querySelectorAll('.fav-btn').forEach(b=>b.onclick=()=>{
    const n=b.dataset.n; state[n]=state[n]||{owned:false,qty:0,fav:false,want:false};
    state[n].fav=!state[n].fav; save(); renderGrid();
  });
  grid.querySelectorAll('.want-btn').forEach(b=>b.onclick=()=>{
    const n=b.dataset.n; state[n]=state[n]||{owned:false,qty:0,fav:false,want:false};
    state[n].want=!state[n].want; save(); renderGrid();
  });
}

document.getElementById('search').oninput = (e)=>{ query=e.target.value; renderGrid(); };
recalcFilterOptions(); renderCatTabs(); renderFilters(); renderRoleFilters(); renderQuickFilters(); renderStats(); renderGrid();
</script>
</body>
</html>
